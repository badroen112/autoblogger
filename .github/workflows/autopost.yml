name: Auto Post

on:
  schedule:
    - cron: '0 2 * * *'

  workflow_dispatch:

jobs:

  post:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5

        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - run: python post.py

      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .
          git commit -m "update"
          git push
